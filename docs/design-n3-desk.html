<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#100f0e; --bg2:#0b0a0a; --surface:#181715; --raised:#1f1d1b; --hover:#272522; --sunk:#141312;
  --line:#2a2825; --line2:#37342f;
  --text:#efebe5; --text2:#bdb7ad; --muted:#8c867c; --faint:#5e5953;
  --agent:#ff7a45; --agent-2:rgba(255,122,69,.14); --agent-3:rgba(255,122,69,.35);
  --you:#7aa2ff; --you-2:rgba(122,162,255,.14); --you-3:rgba(122,162,255,.4);
  --ok:#62c792; --ok-2:rgba(98,199,146,.14);
  --warn:#e6b650; --mem:#b495ff; --mach:#8f9ba8;
  --shadow:0 1px 0 rgba(255,255,255,.035) inset, 0 10px 30px -12px rgba(0,0,0,.6);
  --focus:0 0 0 2px var(--bg), 0 0 0 4px var(--you);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f1ec; --bg2:#e9e6e0; --surface:#fffefb; --raised:#f8f6f2; --hover:#efece6; --sunk:#f1eee9;
  --line:#e3dfd7; --line2:#d3cec4;
  --text:#1c1a17; --text2:#48433d; --muted:#716b62; --faint:#a59f95;
  --agent:#dd5519; --agent-2:rgba(221,85,25,.09); --agent-3:rgba(221,85,25,.32);
  --you:#2d62d8; --you-2:rgba(45,98,216,.09); --you-3:rgba(45,98,216,.35);
  --ok:#1f8f57; --ok-2:rgba(31,143,87,.1);
  --warn:#a87a12; --mem:#7650dc; --mach:#5d6975;
  --shadow:0 1px 2px rgba(40,30,20,.05), 0 8px 24px -14px rgba(40,30,20,.22);
  color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f1ec; --bg2:#e9e6e0; --surface:#fffefb; --raised:#f8f6f2; --hover:#efece6; --sunk:#f1eee9;
    --line:#e3dfd7; --line2:#d3cec4;
    --text:#1c1a17; --text2:#48433d; --muted:#716b62; --faint:#a59f95;
    --agent:#dd5519; --agent-2:rgba(221,85,25,.09); --agent-3:rgba(221,85,25,.32);
    --you:#2d62d8; --you-2:rgba(45,98,216,.09); --you-3:rgba(45,98,216,.35);
    --ok:#1f8f57; --ok-2:rgba(31,143,87,.1);
    --warn:#a87a12; --mem:#7650dc; --mach:#5d6975;
    --shadow:0 1px 2px rgba(40,30,20,.05), 0 8px 24px -14px rgba(40,30,20,.22);
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.4 Inter,"Inter var",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";overflow-x:hidden}
.mono,.num{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num{font-family:inherit;font-feature-settings:"tnum"}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px}
kbd{font:500 10.5px/1 "JetBrains Mono",ui-monospace,monospace;padding:2px 4px;border-radius:4px;border:1px solid var(--line2);color:var(--muted);background:var(--sunk)}
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:42px auto minmax(0,1fr) 30px;height:100vh;min-height:760px}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em}
.brand canvas{width:20px;height:20px;image-rendering:pixelated;border-radius:5px}
.brand small{font-weight:500;color:var(--muted)}
.sep{width:1px;height:16px;background:var(--line2)}
.fleet{display:flex;gap:14px;color:var(--text2);font-size:12px}
.fleet span{display:inline-flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.agent{background:var(--agent)} .dot.you{background:var(--you)} .dot.ok{background:var(--ok)}
.top .sp{flex:1}
.tbtn{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line);color:var(--text2);background:var(--surface)}
.tbtn:hover{background:var(--hover);color:var(--text)}
.clock{font-size:12px;color:var(--text2)}

/* needs strip */
.needs{display:flex;gap:10px;align-items:stretch;padding:10px 16px 0}
.nlabel{display:flex;flex-direction:column;justify-content:center;gap:2px;width:78px;flex:none;padding-left:2px}
.nlabel b{font-size:22px;font-weight:600;color:var(--you);line-height:1}
.nlabel b.zero{color:var(--muted)}
.nlabel span{font-size:11.5px;color:var(--muted)}
.ask{position:relative;display:flex;align-items:center;gap:14px;min-width:0;padding:9px 10px 9px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:flex .3s ease,opacity .3s}
.ask::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--you)}
.ask.lner{flex:2.3}.ask.blender{flex:1}
.ask .txt{min-width:0;flex:1;cursor:pointer;overflow:hidden}
.ask .l1{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.ask .l1 b{font-size:14px;font-weight:600;letter-spacing:-.01em}
.ask .tag{font-size:11px;color:var(--muted);white-space:nowrap}
.ask .tag .mono{color:var(--text2)}
.ask .l2{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ask .l2 .over{color:var(--you)}
.acts{display:flex;gap:4px;flex:none}
.btn{height:30px;padding:0 12px;border-radius:7px;border:1px solid var(--line2);background:var(--raised);color:var(--text);font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--you);border-color:var(--you);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text2)}
.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.ask.done{flex:1;opacity:.9;box-shadow:none;background:var(--raised)}
.ask.done::before{background:var(--ok)}
.ask.held::before{background:var(--muted)}
.ask .rcpt{display:flex;align-items:center;gap:8px;min-width:0;flex:1;font-size:12.5px;color:var(--text2);white-space:nowrap;overflow:hidden}
.ask .rcpt b{color:var(--text);font-weight:600}
.ask .rcpt svg{flex:none;color:var(--ok)}
.clear{display:none;align-items:center;gap:10px;padding:0 14px;border-radius:10px;border:1px dashed var(--line2);color:var(--muted);font-size:12.5px;flex:1}
.clear canvas{width:120px;height:24px;image-rendering:pixelated;opacity:.85}
.needs.empty .clear{display:flex}

/* desk */
.desk{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:12px;padding:10px 16px;min-height:0}
.focus{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px 10px;transition:border-color .2s, box-shadow .2s}
body.driving .focus{border-color:var(--you);box-shadow:0 0 0 1px var(--you), var(--shadow)}
.focus.rewound{border-color:var(--line2)}
.fh{display:flex;align-items:flex-start;gap:16px;padding:2px 2px 8px;border-bottom:1px solid var(--line)}
.fh-l{min-width:0;flex:1}
.fh-1{display:flex;align-items:center;gap:9px;white-space:nowrap;min-width:0}
.rid{font:600 12px "JetBrains Mono",ui-monospace,monospace;color:var(--muted);padding:2px 5px;border-radius:5px;background:var(--sunk);border:1px solid var(--line)}
.fh h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.015em}
.fh-meta{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.fh-2{display:flex;align-items:baseline;gap:9px;margin-top:6px;min-width:0}
.fh-2 .nk{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--agent);flex:none}
body.driving .fh-2 .nk{color:var(--you)}
.focus.rewound .fh-2 .nk{color:var(--muted)}
.fh-2 .int{font-size:15px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fh-2 .sub{font-size:12px;color:var(--muted);white-space:nowrap}
.fh-r{display:flex;align-items:center;gap:16px;flex:none}
.hstat{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.hstat small{font-size:10.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.hstat b{font:500 13px "JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.hstat b i{font-style:normal;color:var(--muted)}
.ctl{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--you-3);color:var(--you);background:var(--you-2);font-weight:600;display:inline-flex;align-items:center;gap:8px}
.ctl:hover{background:var(--you);color:#fff}
.ctl kbd{border-color:currentColor;color:inherit;background:transparent;opacity:.7}
body.driving .ctl{background:var(--you);color:#fff;border-color:var(--you)}

.pill{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:10px;font-size:11px;font-weight:600;letter-spacing:.01em;white-space:nowrap;flex:none}
.pill .dot{width:6px;height:6px}
.pill.live{background:var(--agent-2);color:var(--agent)} .pill.live .dot{background:var(--agent);animation:pulse 1.6s ease-in-out infinite}
.pill.wait,.pill.approval,.pill.driving{background:var(--you-2);color:var(--you)} .pill.wait .dot,.pill.approval .dot,.pill.driving .dot{background:var(--you)}
.pill.running{background:var(--ok-2);color:var(--ok)} .pill.running .dot{background:var(--ok)}
.pill.held{background:var(--sunk);color:var(--muted);border:1px solid var(--line)} .pill.held .dot{background:var(--muted)}
.pill.replay{background:var(--sunk);color:var(--text2);border:1px solid var(--line2)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.fb{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:14px;padding-top:8px}
.lc{min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
.rc{min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:auto;padding-right:2px}

/* browser frame */
.bw{border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--sunk);flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.bw .vp.main{flex:1;min-height:0;aspect-ratio:auto}
.chrome{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;background:var(--raised);border-bottom:1px solid var(--line)}
.chrome .nav{display:flex;gap:2px;color:var(--faint)}
.chrome .nav svg{display:block}
.url{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:6px;background:var(--sunk);border:1px solid var(--line);font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden}
.url b{font-weight:500;color:var(--text)}
.url svg{flex:none;color:var(--muted)}
.chrome .who{font-size:11.5px;color:var(--muted);white-space:nowrap}
.rwb{display:inline-flex;align-items:center;gap:7px;color:var(--text2)}
.rwb b{color:var(--text);font-weight:600}
.vp-banner[hidden]{display:none}
.vp{position:relative;overflow:hidden;aspect-ratio:16/9;width:100%;background:var(--sunk)}
.pg{position:absolute;left:var(--ox,0px);top:var(--oy,0px);width:800px;height:400px;transform-origin:0 0;transform:scale(var(--s,.5));overflow:hidden;font:13px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.vp-banner{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:8px;height:26px;padding:0 6px 0 10px;border-radius:7px;background:var(--surface);border:1px solid var(--line2);font-size:12px;color:var(--text2);box-shadow:var(--shadow);z-index:5}
.vp-banner b{color:var(--text);font-weight:600}
.drive-bar{white-space:nowrap;overflow:hidden;position:absolute;left:10px;right:10px;bottom:10px;display:none;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:9px;background:var(--you);color:#fff;font-size:12.5px;z-index:6;box-shadow:0 8px 24px -8px rgba(0,0,0,.5)}
.drive-bar b{font-weight:600}
.drive-bar .sp{flex:1}
.drive-bar button{display:inline-flex;align-items:center;gap:6px;flex:none;height:26px;padding:0 10px;border-radius:6px;background:rgba(255,255,255,.18);color:#fff;font-weight:600;font-size:12px}
.drive-bar button:hover{background:rgba(255,255,255,.28)}
body.driving .focus.ctlfocus .drive-bar{display:flex}
.rcur{position:absolute;z-index:7;pointer-events:none;display:none;transform:translate(-2px,-2px)}
body.driving .focus.ctlfocus .rcur.on{display:block}
body.driving .focus.ctlfocus .vp.main{cursor:none}

/* agent overlays (inside page coords) */
.hl{position:absolute;border:2px solid var(--agent);border-radius:9px;box-shadow:0 0 0 4px var(--agent-3);pointer-events:none}
.hl.read,.hl.wait{border-style:dashed;box-shadow:none}
.hl.next{border-style:dotted;box-shadow:none}
.hl-tag{position:absolute;left:-2px;top:-26px;white-space:nowrap;font:600 12px/20px "JetBrains Mono",ui-monospace,monospace;color:#fff;background:var(--agent);padding:0 8px;border-radius:5px}
.acur{position:absolute;pointer-events:none;transition:left .6s cubic-bezier(.3,.7,.2,1),top .6s cubic-bezier(.3,.7,.2,1)}
.acur .nm{position:absolute;left:20px;top:20px;font:600 12px/20px Inter,system-ui,sans-serif;background:var(--agent);color:#fff;padding:0 8px;border-radius:10px;white-space:nowrap}
body.driving .focus.ctlfocus .acur,body.driving .focus.ctlfocus .hl{display:none}

/* filmstrip */
.fs{display:flex;gap:6px;align-items:stretch;flex:none;user-select:none;touch-action:none}
.fs-cells{flex:1;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;min-width:0;position:relative}
.fs-c{display:flex;flex-direction:column;gap:4px;padding:3px;border-radius:7px;border:1px solid transparent;text-align:left;min-width:0}
.fs-c:hover{background:var(--hover)}
.fs-c .vp{border-radius:4px;border:1px solid var(--line);pointer-events:none}
.fs-c .fl{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);padding:0 2px;white-space:nowrap}
.fs-c .fl b{font:500 11px "JetBrains Mono",ui-monospace,monospace;color:var(--text2)}
.fs-c .fl em{font-style:normal;overflow:hidden;text-overflow:ellipsis}
.fs-c.sel{border-color:var(--agent);background:var(--agent-2)}
.fs-c.after{opacity:.38}
.fs-c.sel .fl b{color:var(--text)}
.k{width:6px;height:6px;border-radius:2px;flex:none;display:inline-block}
.k.you{background:var(--you)} .k.memory{background:var(--mem)} .k.machine{background:var(--mach)} .k.browser{background:var(--agent)} .k.term{background:var(--ok)}
.livebtn{flex:none;width:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:8px;border:1px solid var(--line);color:var(--muted);font-size:11.5px;font-weight:600}
.livebtn .dot{background:var(--agent)}
.livebtn.on{color:var(--agent);border-color:var(--agent-3);background:var(--agent-2)}
.livebtn.on .dot{animation:pulse 1.6s infinite}
.livebtn.back{color:#fff;background:var(--agent);border-color:var(--agent)}
.livebtn.back .dot{background:#fff}
.livebtn kbd{font-size:9.5px;padding:1px 3px}
.livebtn.back kbd{color:#fff;border-color:rgba(255,255,255,.5);background:transparent}
.tscale{position:relative;height:3px;border-radius:2px;background:var(--line);margin:0 2px}
.tscale i{position:absolute;top:-2px;width:2px;height:7px;border-radius:1px}
.tscale .prog{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--agent);opacity:.7;transition:width .25s}

/* log */
.log{flex:none;height:198px;display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:6px}
.sh{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;flex:none}
.sh .sp{flex:1}
.sh .aux{text-transform:none;letter-spacing:0;font-weight:500;color:var(--faint)}
.sh .aux.rw{color:var(--text2)}
.lg{overflow:auto;min-height:0;flex:1}
.lr{display:grid;grid-template-columns:46px 128px minmax(0,1.35fr) minmax(0,1fr) 42px;gap:10px;align-items:center;height:17px;font:11.5px/17px "JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;color:var(--text2);padding:0 4px;border-radius:4px;white-space:nowrap}
.lr>span{overflow:hidden;text-overflow:ellipsis}
.lr .t{color:var(--faint)}
.lr .ms{text-align:right;color:var(--muted)}
.lr .tool{color:var(--text)}
.lr.after{opacity:.25}
.lr.cur{background:var(--agent-2)}
.lr.cur .res{color:var(--agent)}
.lr.you .tool{color:var(--you)}

/* right column panels */
.panel{flex:none}
.steps{list-style:none;margin:0;padding:0}
.st{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:start;padding:0 4px;border-radius:5px;font-size:12.5px;line-height:16.5px}
.st .ic{width:16px;height:17px;display:flex;align-items:center;justify-content:center}
.st .ic i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--faint)}
.st.done .ic i{border:0;background:var(--ok);width:8px;height:8px}
.st.cur .ic i{border:0;background:var(--agent);box-shadow:0 0 0 3px var(--agent-2)}
body.driving .focus.ctlfocus .st.cur .ic i{background:var(--you);box-shadow:0 0 0 3px var(--you-2)}
.st.todo .ic i{border-style:dashed}
.st.after{opacity:.4}
.st .tt{min-width:0;color:var(--text2)}
.st.cur{background:var(--raised)}
.st.cur .tt{color:var(--text);font-weight:500}
.st.todo .tt{color:var(--muted)}
.st .tm{font:11px/17px "JetBrains Mono",ui-monospace,monospace;color:var(--faint)}
.st .dt{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:1px}
.st.clickable{cursor:pointer}
.st.clickable:hover{background:var(--hover)}
.mem .row{display:grid;grid-template-columns:30px 1fr auto;gap:8px;font-size:12px;line-height:17px;padding:0 4px;color:var(--text2)}
.mem .row .sc{font:500 11px/17px "JetBrains Mono",ui-monospace,monospace;color:var(--mem)}
.mem .row .src{font-size:11px;color:var(--faint);white-space:nowrap}
.mem .row .op{font:600 12px/17px "JetBrains Mono",ui-monospace,monospace;text-align:center}
.mem .op.add{color:var(--ok)} .mem .op.mod{color:var(--warn)}
.mem .sub{font-size:11px;color:var(--muted);margin:4px 4px 1px;display:flex;gap:6px}
.mem .sub i{font-style:normal;color:var(--faint)}
.mem.pending .rec{opacity:.3}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sc2{padding:5px 8px 6px;border-radius:7px;background:var(--raised);border:1px solid var(--line);min-width:0}
.sc2 small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.sc2 .v{display:flex;align-items:center;gap:6px}
.sc2 .v svg{flex:1;min-width:0;margin:0}
.sc2 .v .bar{flex:1;margin:0}
.sc2 b{display:block;flex:none;font:500 13px/18px "JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.sc2 b i{font-style:normal;color:var(--muted);font-size:11px}
.sc2 svg{display:block;margin-top:1px;width:100%;height:12px}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--text2);border-radius:2px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px 18px;padding:0 4px}
.kvr{display:grid;grid-template-columns:48px auto minmax(0,1fr);gap:8px;align-items:center;height:19px;font-size:12px}
.kvr .kl{color:var(--muted)}

function scaleVp(v){const w=v.clientWidth,h=v.clientHeight;if(!w)return;let s=w/800,ox=0,oy=0;

    $$('.pg',v).forEach(p=>p.style.width=pw+'px'); const old=v._pw; v._pw=pw; if(old&&Math.abs(old-pw)>1&&v._re) v._re();}
  else if(h&&v.closest('.tile')){s=h/400;const pw=Math.max(640,w/s);s=Math.max(s,w/pw);$$('.pg',v).forEach(p=>p.style.width=pw+'px')}

const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function hexRGB(c){const m=c.match(/^#([0-9a-f]{6})$/i);if(!m)return[255,122,69];const n=parseInt(m[1],16);return[n>>16,(n>>8)&255,n&255]}
function ditherTo(cv,fn,col,bg){
  const ctx=cv.getContext('2d'),W=cv.width,H=cv.height,img=ctx.createImageData(W,H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=fn(x/W,y/H,x,y),on=v*16>BAYER[(y&3)*4+(x&3)]+.5,i=(y*W+x)*4,c=on?col:bg;img.data[i]=c[0];img.data[i+1]=c[1];img.data[i+2]=c[2];img.data[i+3]=c[3]??255}
  ctx.putImageData(img,0,0);
}
function drawDithers(root=document){
  const ag=hexRGB(css('--agent')),mc=hexRGB(css('--mach')),sk=hexRGB(css('--sunk')),you=hexRGB(css('--you'));
  $$('canvas[data-dither="wake"]',root).forEach(cv=>ditherTo(cv,(u,v)=>{const d=Math.hypot(u-.5,(v-.5)*.56);return Math.max(0,.62-d*1.25)*(.75+.25*Math.sin(u*9+v*4))},[...mc,110],[...sk,255]));
  $$('canvas[data-dither="clear"]',root).forEach(cv=>ditherTo(cv,(u,v)=>Math.max(0,1-Math.abs(v-.5-.3*Math.sin(u*7))*3)*(1-u*.6),[...you,200],[0,0,0,0]));
}

function bindStrip(){
  const cells=$('#fsCells');
  let drag=false;
  const pick=x=>{const cs=$$('.fs-c',cells);for(let k=0;k<cs.length;k++){const b=cs[k].getBoundingClientRect();if(x<b.right+2)return k}return cs.length-1};
  cells.addEventListener('pointerdown',e=>{drag=true;cells.setPointerCapture(e.pointerId);setCur(pick(e.clientX));e.preventDefault()});
  cells.addEventListener('pointermove',e=>{if(drag){const k=pick(e.clientX);if(k!==curIdx())setCur(k)}});
  cells.addEventListener('pointerup',()=>drag=false);
  cells.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const b=e.target.closest('.fs-c');if(b){setCur(+b.dataset.i);e.preventDefault()}}});
  $('#liveBtn').addEventListener('click',()=>setCur(null));

});

/* theme */
function curTheme(){return document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}
function toggleTheme(){document.documentElement.dataset.theme=curTheme()==='dark'?'light':'dark';themeRefresh()}
function themeRefresh(){$('#themeLbl').textContent=curTheme()==='dark'?'Dark':'Light';drawMark();drawDithers()}
$('#themeBtn').addEventListener('click',toggleTheme);
matchMedia('(prefers-color-scheme: light)').addEventListener('change',themeRefresh);

/* palette */
const pal=$('#pal'),palIn=$('#palIn'),palList=$('#palList');let palSel=0,palItems=[];
function cmds(){
  const c=[];
  ORDER.forEach((id,k)=>c.push({g:'Focus',t:`Run ${id} · ${R[id].title}`,k:String(k+1),f:()=>focusRun(id)}));
  c.push({g:'Control',t:S.control?'Hand back control':`Take control of ${R[S.focus].machine}`,k:'T',f:toggleControl});
  c.push({g:'Replay',t:'Back to live',k:'L',f:()=>{focusRun('214');setCur(null)}});
  EV.forEach((e,i)=>c.push({g:'Replay',t:`Rewind run 214 to ${fmt(e.t)} · ${e.title}`,f:()=>{focusRun('214');setCur(i)}}));
  if(S.lner!=='approved'&&S.lner!=='always'){c.push({g:'Approve',t:'Approve £142.40 to LNER',f:()=>act('approve')});c.push({g:'Approve',t:'Hold the LNER payment',f:()=>act('hold')});c.push({g:'Approve',t:'Approve and never ask for LNER',f:()=>act('always')})}
  if(!S.blender){c.push({g:'Answer',t:'Blender: install 4.5 LTS',f:()=>act('b45')});c.push({g:'Answer',t:'Blender: install 4.6',f:()=>act('b46')})}
  c.push({g:'View',t:`Switch to ${curTheme()==='dark'?'light':'dark'} theme`,f:toggleTheme});
  return c;
}
function palRender(){const q=palIn.value.toLowerCase().trim();palItems=cmds().filter(c=>!q||(c.g+' '+c.t).toLowerCase().includes(q));palSel=Math.min(palSel,Math.max(0,palItems.length-1));
  palList.innerHTML=palItems.map((c,i)=>`<li class="${i===palSel?'on':''}" data-i="${i}"><span class="g">${c.g}</span><span>${esc(c.t)}</span><span class="sp"></span>${c.k?`<kbd>${c.k}</kbd>`:''}</li>`).join('')||'<li style="color:var(--muted)">No matches</li>';
  const on=$('li.on',palList); on&&on.scrollIntoView({block:'nearest'});}
function palOpen(){pal.classList.add('open');palIn.value='';palSel=0;palRender();palIn.focus()}
function palClose(){pal.classList.remove('open')}
function palRun(i){const c=palItems[i];palClose();c&&c.f()}
$('#openPal').addEventListener('click',palOpen);
pal.addEventListener('click',e=>{if(e.target===pal)palClose();const li=e.target.closest('li[data-i]');if(li)palRun(+li.dataset.i)});
palIn.addEventListener('input',()=>{palSel=0;palRender()});
palIn.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){palSel=Math.min(palItems.length-1,palSel+1);palRender();e.preventDefault()}else if(e.key==='ArrowUp'){palSel=Math.max(0,palSel-1);palRender();e.preventDefault()}else if(e.key==='Enter'){palRun(palSel)}else if(e.key==='Escape'){palClose()}});

document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();pal.classList.contains('open')?palClose():palOpen();return}
  if(pal.classList.contains('open')) return;
  if(e.target.matches('input,textarea')||e.metaKey||e.ctrlKey||e.altKey) return;
  if(['1','2','3','4'].includes(e.key)) focusRun(ORDER[+e.key-1]);
  else if(e.key==='t'||e.key==='T') toggleControl();
  else if(e.key==='l'||e.key==='L'||e.key==='Escape') {if(S.focus==='214')setCur(null)}
  else if(e.key==='ArrowLeft'&&S.focus==='214'){setCur(curIdx()-1);e.preventDefault()}
  else if(e.key==='ArrowRight'&&S.focus==='214'){setCur(curIdx()+1);e.preventDefault()}
});

/* ------------------------------------------------ ticking: only things that are actually happening */
function tick(){
  S.now++; $('#clock').textContent=clockStr(S.now);
  ORDER.forEach(id=>{R[id].el++; const a=spark[id]; a.push(nextVal(id,a[a.length-1]||.4)); if(a.length>80)a.shift();});
  if(!S.control||S.control!=='214') S.tokens+= (rnd()<.5?1:0);
  $$('[data-b]').forEach(el=>{const b=el.dataset.b;
    if(b.startsWith('el')&&b!=='el214b') el.textContent=fmt(R[b.slice(2)].el);
    else if(b==='el214b') el.textContent=fmt(R['214'].el);
    else if(b==='up') el.textContent=fmt(R['214'].el+2);
    else if(b==='cpu') el.textContent=(S.control==='214'?6:30+Math.round(spark['214'].at(-1)*16))+'%';
    else if(b==='net') el.innerHTML=(S.control==='214'?0.1:(1.6+spark['214'].at(-1)*1.6)).toFixed(1)+' <i>MB/s</i>';
    else if(b==='tok') el.textContent=S.tokens+'k';
    else if(b==='tbar') el.style.width=(R['214'].el/900*100).toFixed(1)+'%';
  });
  $$('[data-sp]').forEach(el=>{const id=el.dataset.sp;el.innerHTML=sparkSVG(spark[id].slice(-30),56,14,stCol(status(id)))});
  if(S.focus==='214'&&S.cur==null&&!S.control){$('#intS').textContent=`waiting for text “cancelled” · ${fmt(R['214'].el-66)}`}
  const fs=$('#ftok'); if(fs) fs.textContent=(1.24+(S.tokens-38)/1000).toFixed(2)+'M';
  if(S.now%3===0) renderStats();
}

/* ------------------------------------------------ boot */
ORDER.forEach(id=>{spark[id]=genSpark(id,80)});
all(); themeRefresh();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
setTimeout(()=>setInterval(tick,1000),reduce?1500:2500);
window.addEventListener('resize',()=>fit());
})();
</script>
</body>
